user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP redirect server block: forward traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS proxy server block
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name localhost;

        # SSL Certificates (mounted into Nginx container via volumes)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        
        # Load SSL security parameter profiles
        include /etc/nginx/ssl.conf;

        # Reverse proxy settings
        location / {
            proxy_pass http://web:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for smoother streaming/responses
            proxy_buffering off;
            proxy_redirect off;
        }

        # Override log destination to direct into the logs folder volume
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
    }
}
