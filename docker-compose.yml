version: '3.8'

services:
  # Python backend application service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lan_gateway_web
    restart: unless-stopped
    volumes:
      - ./database:/app/database
      - ./whitelist:/app/whitelist
      - ./logs:/app/logs
    env_file:
      - .env
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy/SSL termination service
  nginx:
    image: nginx:1.25-alpine
    container_name: lan_gateway_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
